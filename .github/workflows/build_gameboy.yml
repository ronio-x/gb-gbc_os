name: Build ESP32-S3 Dedicated GameBoy Console (Peanut-GB)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python & Install PlatformIO
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip
          pip3 install --upgrade platformio esptool

      - name: Generate Complete GameBoy Console Project
        run: |
          mkdir -p gb_project/src
          mkdir -p gb_project/include

          # ১. Peanut-GB কোর ডাউনলোড
          curl -sSfL "https://raw.githubusercontent.com/deltabeard/Peanut-GB/master/peanut_gb.h" -o gb_project/include/peanut_gb.h

          # ২. পিকো ম্যাক্রো রিমুভার (এরর ফিক্স)
          python3 -c '
          with open("gb_project/include/peanut_gb.h", "r") as f:
              data = f.read()
          # Pico ম্যাক্রো গুলো মুছে ফেলা
          data = data.replace("__not_in_flash_func(", "")
          data = data.replace("__attribute__((section(\".time_critical\")))", "")
          with open("gb_project/include/peanut_gb.h", "w") as f:
              f.write(data)
          print("Pico macros cleaned successfully!")
          '

          # ৩. ১৬ MB শেয়ার্ড ২-স্লট পার্টিশন টেবিল
          cat << 'EOF' > gb_project/partitions.csv
          # Name,   Type, SubType, Offset,   Size,     Flags
          nvs,      data, nvs,     0x9000,   0x6000,
          otadata,  data, ota,     0xf000,   0x2000,
          app0,     app,  ota_0,   0x20000,  0x380000,
          app1,     app,  ota_1,   0x3a0000, 0x380000,
          vfs,      data, fat,     0x720000, 0x8e0000,
          EOF

          # ৪. PlatformIO কনফিগারেশন
          cat << 'EOF' > gb_project/platformio.ini
          [env:esp32-s3-gameboy]
          platform = espressif32
          board = esp32-s3-devkitc-1
          framework = arduino
          board_build.flash_mode = qio
          board_build.f_flash = 80000000L
          board_upload.flash_size = 16MB
          board_build.partitions = partitions.csv
          board_build.filesystem = littlefs
          build_flags =
              -O3
              -DBOARD_HAS_PSRAM
              -mfix-esp32-psram-cache-issue
              -DCONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=0
              -DCORE_DEBUG_LEVEL=0
              -DENABLE_LCD=1
              -DENABLE_SOUND=0
              -DPEANUT_FULL_GBC_SUPPORT=1
          lib_deps =
              lovyan03/LovyanGFX @ ^1.1.16
          EOF

          # ৫. মাস্টার গেমবয় কোড
          cat << 'EOF' > gb_project/src/main.cpp
          #define LGFX_USE_V1
          #define ENABLE_LCD 1
          #define ENABLE_SOUND 0
          #define PEANUT_FULL_GBC_SUPPORT 1

          #include <LovyanGFX.hpp>
          #include <Arduino.h>
          #include <FS.h>
          #include <LittleFS.h>
          #include <esp_ota_ops.h>
          #include <esp_partition.h>
          #include <vector>
          #include "peanut_gb.h"

          class LGFX : public lgfx::LGFX_Device {
              lgfx::Panel_ILI9341 _panel;
              lgfx::Bus_SPI       _bus;
              lgfx::Light_PWM     _light;
          public:
              LGFX() {
                  {
                      auto cfg = _bus.config();
                      cfg.spi_host = SPI2_HOST;
                      cfg.spi_mode = 0;
                      cfg.freq_write = 40000000;
                      cfg.pin_sclk = 12;
                      cfg.pin_mosi = 11;
                      cfg.pin_miso = 13;
                      cfg.pin_dc   = 8;
                      _bus.config(cfg);
                      _panel.setBus(&_bus);
                  }
                  {
                      auto cfg = _panel.config();
                      cfg.pin_cs   = 10;
                      cfg.pin_rst  = 9;
                      cfg.memory_width  = 320;
                      cfg.memory_height = 240;
                      cfg.panel_width   = 320;
                      cfg.panel_height  = 240;
                      cfg.offset_rotation = 0;
                      cfg.rgb_order = true;
                      cfg.invert = false;
                      _panel.config(cfg);
                  }
                  {
                      auto cfg = _light.config();
                      cfg.pin_bl = 7;
                      _light.config(cfg);
                      _panel.setLight(&_light);
                  }
                  setPanel(&_panel);
              }
          };
          LGFX tft;

          #define PIN_JOY_X 1
          #define PIN_JOY_Y 2
          #define PIN_B1    5 
          #define PIN_B2    6 
          #define PIN_B3    40 

          uint8_t *rom_buffer = NULL;
          size_t rom_size = 0;
          struct gb_s gb;

          uint8_t gb_rom_read(struct gb_s *gb, const uint_fast32_t addr) { return rom_buffer[addr]; }
          uint8_t gb_cart_ram_read(struct gb_s *gb, const uint_fast32_t addr) { return 0xFF; }
          void gb_cart_ram_write(struct gb_s *gb, const uint_fast32_t addr, const uint8_t val) {}
          void gb_error(struct gb_s *gb, const enum gb_error_e gb_err, const uint16_t val) {}

          void lcd_draw_line(struct gb_s *gb, const uint8_t pixels[160], const uint_fast8_t line) {
              static uint16_t line_buf[160];
              for (int x=0; x<160; x++) line_buf[x] = (pixels[x] == 3) ? 0x0000 : 0xFFFF;
              tft.pushImage(line*1, 0, 160, 1, line_buf);
          }

          void setup() {
              tft.init();
              tft.setRotation(6);
              pinMode(PIN_B1, INPUT_PULLUP);
              // গেম বয় ইঞ্জিন স্টার্ট
              gb_init(&gb, &gb_rom_read, NULL, NULL, &gb_error, NULL);
          }
          void loop() { delay(10); }
          EOF

      - name: Build GameBoy Binary
        run: |
          cd gb_project
          pio run
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: peanut_gb
          path: gb_project/.pio/build/esp32-s3-gameboy/firmware.bin
